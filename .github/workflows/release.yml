name: release

# Runs on a version tag (vX.Y.Z). It builds the desktop app for macOS, Windows and Linux
# and attaches the installers to a draft GitHub release, to publish by hand after checking it.
# Publishing that draft triggers the site workflow (site.yml), which deploys the download site.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: poc/session-poc/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Linux system libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the UI dependencies
        working-directory: poc/session-poc/ui
        run: pnpm install --frozen-lockfile

      - name: Build the UI the desktop app embeds
        working-directory: poc/session-poc/ui
        run: pnpm build

      - name: Tests before packaging
        working-directory: poc/job-agent
        run: |
          npm install --no-save --ignore-scripts
          node --test "test/*.test.ts"

      - name: Build and publish the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: poc/session-poc/app
          tagName: ${{ github.ref_name }}
          releaseName: "Jobshell ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
