name: site

# Publishes the download site when a release is published, so the version and the download links
# on jobshell.dev always match the release. The build reads the version from the app at the
# release tag. Needs the repository secret CLOUDFLARE_API_TOKEN (Pages: edit) and the variable
# CLOUDFLARE_ACCOUNT_ID.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy the download site
        run: ./scripts/deploy-website.sh
