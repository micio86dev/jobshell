[package]
name = "openjob-spike"
version = "0.1.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
session-poc-core = { path = "../src-tauri", package = "session-poc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
# The ZipRecruiter MCP client: an HTTPS call for the token exchange and the tool calls.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
